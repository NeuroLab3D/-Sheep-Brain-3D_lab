<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آزمایشگاه زیست‌شناسی - تشریح مغز گوسفند</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; 
            overflow: hidden; height: 100vh; background: #07111f; color: #edf5ff; 
        }

        /* ================= صفحه ورود ================= */
        #splash-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #000; 
            background-image: url('dna.jpg'); 
            background-size: cover; background-position: center; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 9999; transition: opacity 0.5s ease; 
            animation: zoomBg 20s ease-in-out infinite alternate; 
        }
        @keyframes zoomBg { 0% { background-size: 100%; } 100% { background-size: 120%; } }
        .overlay { position: absolute; inset: 0; background: rgba(5, 10, 20, 0.6); z-index: 1; }
        .splash-content { 
            position: relative; z-index: 2; text-align: center; padding: 40px 30px; 
            background: rgba(15, 20, 30, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .splash-content h1 { font-size: 30px; margin: 0 0 15px 0; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .splash-content p { font-size: 16px; color: #b8cbe1; margin-bottom: 35px; }
        .enter-btn { 
            background: linear-gradient(135deg, #00e5ff 0%, #007bb5 100%); 
            border: none; color: #000; padding: 15px 70px; font-size: 18px; font-weight: bold; 
            border-radius: 50px; cursor: pointer; font-family: inherit; 
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.4); transition: all 0.2s; 
        }
        .enter-btn:active { transform: scale(0.95); }
        .creators { position: absolute; bottom: 25px; width: 100%; text-align: center; font-size: 12px; color: #8b9bb4; font-weight: 300; direction: rtl; z-index: 2; }
        .creators span { margin: 0 10px; }

        /* ================= محیط اصلی ================= */
        #app-container { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        #main-container { position: absolute; inset: 0; display: flex; flex-direction: column; }
        
        .main-tabs { display: flex; background: #0a192b; border-bottom: 1px solid #29496d; z-index: 100; flex-shrink: 0; }
        .tab-btn { 
            flex: 1; padding: 15px; background: transparent; border: none; 
            color: #8b9bb4; font-family: inherit; font-size: 16px; cursor: pointer; 
            transition: 0.3s; border-bottom: 3px solid transparent; 
        }
        .tab-btn.active { color: #fff; border-bottom-color: #00e5ff; background: #07111f; }
        .tab-content { flex: 1; display: none; position: relative; overflow: hidden; }
        .tab-content.active { display: flex; flex-direction: column; }

        /* --- تب مدل آنلاین --- */
        #model-container { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 15px; padding: 15px; height: 100%; overflow: hidden;}
        #threejs-iframe-container { border: 1px solid #29496d; border-radius: 14px; overflow: hidden; background: #07111f; }
        #threejs-iframe-container iframe { width: 100%; height: 100%; border: none; }
        
        .translation-sidebar { background: #0c1d32; border: 1px solid #29496d; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 15px; background: #102b49; border-bottom: 1px solid #29496d; }
        .sidebar-header h2 { font-size: 16px; margin: 0 0 8px; color: #eafcff; }
        .sidebar-header p { font-size: 12px; color: #b8cbe1; margin: 0; line-height: 1.6; }
        
        .translation-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .translation-item { background: #15385d; border: 1px solid #4775a8; border-radius: 10px; padding: 12px; cursor: pointer; transition: 0.2s; }
        .translation-item:hover { background: #23639a; border-color: #80c4ff; }
        .translation-item.active { background: #23639a; border-color: #00e5ff; }
        .translation-item .en-name { font-size: 14px; color: #a4b8d0; font-family: monospace; margin-bottom: 4px; display: block; direction: ltr; text-align: left;}
        .translation-item .fa-name { font-size: 16px; color: #fff; font-weight: bold; display: block; margin-bottom: 4px; }
        .translation-item .desc { font-size: 13px; color: #d6e4f4; line-height: 1.8; margin: 0; display: none; text-align: justify;}
        .translation-item.active .desc { display: block; }

        /* --- تب فعالیت ۷ --- */
        #activity-container { display: flex; height: 100%; width: 100%; }
        .activity-model-side { width: 50%; display: flex; flex-direction: column; border-left: 1px solid #29496d; background: #07111f; position: relative;}
        .activity-guide-side { width: 50%; display: flex; flex-direction: column; background: #08182a; overflow: hidden; }
        
        .model-tabs { display: flex; gap: 5px; padding: 10px; background: #0a192b; border-bottom: 1px solid #29496d; overflow-x: auto; flex-shrink: 0;}
        .model-tabs button { font-size: 11px; padding: 8px 10px; background: #15385d; border: 1px solid #4775a8; border-radius: 8px; color: #fff; cursor: pointer; white-space: nowrap; }
        .model-tabs button.active { background: #23639a; border-color: #80c4ff; }
        
        #threejs-canvas-wrapper { flex: 1; position: relative; overflow: hidden; }
        #threejs-canvas-wrapper canvas { display: block; width: 100%; height: 100%; }
        
        /* پنل اطلاعات مدل در تب فعالیت */
        .info-panel-activity {
            position: absolute; bottom: 15px; left: 15px; right: 15px;
            background: rgba(16, 39, 67, 0.95); border: 1px solid #00e5ff;
            border-radius: 12px; padding: 15px; color: #fff; backdrop-filter: blur(5px);
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 10;
            max-height: 45%; overflow-y: auto;
        }
        .info-panel-activity.show { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .info-panel-activity h3 { font-size: 18px; color: #00e5ff; margin: 0 0 5px; }
        .info-panel-activity .en-title { font-size: 13px; color: #8faec9; font-family: monospace; display: block; margin-bottom: 10px; direction: ltr; text-align: left; }
        .info-panel-activity p { font-size: 14px; line-height: 1.9; color: #d6e4f4; margin: 0; text-align: justify; }
        .info-panel-activity .close-info { position: absolute; top: 10px; left: 10px; background: transparent; border: none; color: #ff5252; font-size: 16px; cursor: pointer; font-weight: bold;}

        .guide-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .guide-card { background: #0d2239; border: 1px solid #29496d; border-radius: 12px; padding: 15px; }
        .guide-card h3 { font-size: 15px; color: #8fd0ff; margin: 0 0 10px; }
        .guide-card p { font-size: 14px; line-height: 2; color: #d6e4f4; margin: 0 0 8px; text-align: justify;}
        .guide-card .pill { display: inline-block; background: #17466d; border-radius: 20px; padding: 6px 12px; font-size: 12px; margin: 4px; color: #fff; }

        @media(max-width: 900px) {
            #model-container { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            #activity-container { flex-direction: column; }
            .activity-model-side { width: 100%; height: 50%; border-left: none; border-bottom: 1px solid #29496d; }
            .activity-guide-side { width: 100%; height: 50%; }
        }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="splash-screen">
        <div class="overlay"></div>
        <div class="splash-content">
            <h1>آزمایشگاه زیست‌شناسی</h1>
            <p>محیط تعاملی تشریح سه‌بعدی مغز گوسفند</p>
            <button class="enter-btn" onclick="enterApp()">ورود به آزمایشگاه</button>
        </div>
        <div class="creators">
            <span>محمد طاها قاسمی</span> • <span>امیرعلی حاجیان</span>
        </div>
    </div>

    <!-- محیط اصلی -->
    <div id="app-container">
        <div id="main-container">
            <div class="main-tabs">
                <button class="tab-btn active" onclick="switchTab('model3d', this)">🌐 مدل سه‌بعدی آنلاین (با ترجمه)</button>
                <button class="tab-btn" onclick="switchTab('activity', this)">📖 تشریح گام‌به‌گام (فعالیت ۷)</button>
            </div>

            <!-- تب ۱: مدل آنلاین + ترجمه -->
            <div id="tab-model3d" class="tab-content active">
                <div id="model-container">
                    <div id="threejs-iframe-container">
                        <iframe src="https://easyanatomylab.com/embed/sheep-brain-dissection" title="مدل سه‌بعدی" allow="fullscreen" allowfullscreen loading="lazy"></iframe>
                    </div>
                    
                    <div class="translation-sidebar">
                        <div class="sidebar-header">
                            <h2>راهنمای ترجمه و عملکرد</h2>
                            <p>روی هر بخش کلیک کنید تا نام فارسی و توضیح دقیق عملکرد آن را ببینید.</p>
                        </div>
                        <div class="translation-list" id="translation-list"></div>
                    </div>
                </div>
            </div>

            <!-- تب ۲: فعالیت ۷ -->
            <div id="tab-activity" class="tab-content">
                <div id="activity-container">
                    <!-- مدل سه‌بعدی -->
                    <div class="activity-model-side">
                        <div class="model-tabs" id="model-tabs">
                            <button class="active" data-scene="external">نمای پشتی</button>
                            <button data-scene="ventral">نمای شکمی</button>
                            <button data-scene="internal">برش درونی</button>
                            <button data-scene="cord">مقطع نخاع</button>
                            <button data-scene="reflex">قوس انعکاسی</button>
                            <button data-scene="spinalNerves">اعصاب نخاعی</button>
                            <button data-scene="cranial">۱۲ عصب مغزی</button>
                        </div>
                        <div id="threejs-canvas-wrapper">
                            <!-- پنل اطلاعات روی مدل -->
                            <div class="info-panel-activity" id="info-panel">
                                <button class="close-info" onclick="document.getElementById('info-panel').classList.remove('show')">✕</button>
                                <h3 id="info-fa">نام</h3>
                                <span class="en-title" id="info-en">English Name</span>
                                <p id="info-desc">توضیحات...</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- راهنمای متنی -->
                    <div class="activity-guide-side">
                        <div class="sidebar-header">
                            <h2>آموزش گام‌به‌گام تشریح (فعالیت ۷)</h2>
                            <p>راهنمای کامل و جامع بر اساس کتاب درسی.</p>
                        </div>
                        <div class="guide-list" id="guide-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function enterApp() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                // شروع رندر مدل
                initThreeScene();
            }, 400);
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }
    </script>

    <!-- ================= دیکشنری ترجمه (تب اول) ================= -->
    <script>
        const translationData = [
            { en: "Cerebrum (cortex)", fa: "مخ (قشر مخ)", desc: "بزرگ‌ترین بخش مغز که به دو نیم‌کره تقسیم می‌شود. مرکز پردازش اطلاعات حسی، حرکتی، یادگیری و حافظه است." },
            { en: "Corpus callosum", fa: "جسم پینه‌ای", desc: "نوار ضخیمی از رشته‌های عصبی سفید که دو نیم‌کره چپ و راست را به هم متصل می‌کند." },
            { en: "Lateral ventricles", fa: "بطن‌های جانبی", desc: "حفره‌های پر از مایع مغزی-نخاعی درون نیم‌کره‌های مخ که از مغز محافظت می‌کنند." },
            { en: "Hippocampus", fa: "هیپوکامپ", desc: "ساختاری در لوب گیجگاهی که نقش اساسی در تثبیت حافظه و پردازش اطلاعات فضایی دارد." },
            { en: "Caudate nucleus", fa: "هسته دمی", desc: "بخشی از عقده‌های قاعده‌ای که در کنترل حرکات ارادی و یادگیری نقش دارد." },
            { en: "Putamen", fa: "پوتامن (پوسته)", desc: "همراه با هسته دمی، جسم مخطط را می‌سازد و در تنظیم حرکات نقش کلیدی دارد." },
            { en: "Thalamus", fa: "تالاموس", desc: "بخشی از دستگاه عصبی مرکزی که پیام‌های حسی را به قشر مغز منتقل می‌کند." },
            { en: "Hypothalamus", fa: "هیپوتالاموس", desc: "مرکز تنظیم دما، گرسنگی، تشنگی و ارتباط با دستگاه درون‌ریز." },
            { en: "Cerebellum", fa: "مخچه", desc: "در پشت ساقه مغز قرار دارد. مسئول هماهنگی حرکات، تعادل و یادگیری مهارت‌های حرکتی است." },
            { en: "Vermis", fa: "کرمینه", desc: "بخش میانی مخچه که دو نیم‌کره را به هم متصل می‌کند." },
            { en: "Medulla Oblongata", fa: "بصل‌النخاع", desc: "پایین‌ترین بخش ساقه مغز که مراکز حیاتی تنفس و ضربان قلب را کنترل می‌کند." },
            { en: "Pons", fa: "پل مغزی", desc: "برجستگی میانی ساقه مغز که مرکز ارتباط بین مخ و مخچه است." }
        ];

        function renderTranslationList() {
            const list = document.getElementById('translation-list');
            list.innerHTML = '';
            translationData.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'translation-item';
                div.innerHTML = `
                    <span class="en-name">${item.en}</span>
                    <span class="fa-name">${item.fa}</span>
                    <p class="desc">${item.desc}</p>
                `;
                div.onclick = () => {
                    document.querySelectorAll('.translation-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                };
                list.appendChild(div);
            });
        }
        renderTranslationList();
    </script>

    <!-- ================= محتوای فعالیت ۷ (متن کتاب) ================= -->
    <script>
        const activitySteps = [
            { 
                title: "آماده‌سازی و وسایل", 
                body: "<p>وسایل لازم: <b>مغز سالم گوسفند (یا گوساله)، ابزار تشریح (چاقوی جراحی، پنس، قیچی) و دستکش</b>. مغز را روی ظرف تشریح قرار دهید و با راهنمایی معلم آماده شوید.</p>" 
            },
            { 
                title: "بررسی بیرونی ـ سطح پشتی", 
                body: "<p>مغز را طوری قرار دهید که سطح پشتی آن به سمت بالا باشد. بقایای پرده مغزی (مننژ) را با دقت جدا کنید تا شیارها و چین‌خوردگی‌های سطح مغز دیده شوند.</p><span class='pill'>نیم‌کره راست و چپ مخ</span><span class='pill'>شیار طولی بین دو نیم‌کره</span><span class='pill'>لوب‌های بویایی</span><span class='pill'>مخچه</span><span class='pill'>کرمینه</span><span class='pill'>بصل‌النخاع</span>" 
            },
            { 
                title: "بررسی بیرونی ـ سطح شکمی", 
                body: "<p>مغز را برگردانید و پرده مغزی را جدا کنید. در این نما ساختارهای زیرین مغز را پیدا کنید.</p><span class='pill'>لوب‌های بویایی</span><span class='pill'>تصالب بینایی (کیاسمای بینایی)</span><span class='pill'>پل مغزی</span><span class='pill'>مخچه</span>" 
            },
            { 
                title: "بررسی درونی ـ جسم پینه‌ای", 
                body: "<p>سطح پشتی مغز را بالا قرار دهید. با شست‌ها دو نیم‌کره را از هم باز کنید تا ساختار سفیدرنگ و نواری شکل <b>جسم پینه‌ای</b> دیده شود.</p>" 
            },
            { 
                title: "بررسی درونی ـ رابط سه‌گوش و بطن‌ها", 
                body: "<p>در جلوی جسم پینه‌ای برش کم‌عمق ایجاد کنید تا <b>رابط سه‌گوش (فورنیکس)</b> دیده شود. در دو طرف آن فضاهای <b>بطن‌های ۱ و ۲</b> و <b>جسم مخطط</b> قرار دارند.</p>" 
            },
            { 
                title: "تالاموس‌ها و بطن سوم", 
                body: "<p>در امتداد رابط سه‌گوش برش دهید تا <b>تالاموس‌ها</b> و در پشت آن‌ها <b>بطن سوم</b>، <b>اپی‌فیز (غده صنوبری)</b> و <b>اجسام چهارقلو</b> دیده شوند.</p>" 
            }
        ];

        function renderGuideSteps() {
            const list = document.getElementById('guide-list');
            list.innerHTML = '';
            activitySteps.forEach((step, index) => {
                const div = document.createElement('div');
                div.className = 'guide-card';
                div.innerHTML = `
                    <h3>${index + 1}. ${step.title}</h3>
                    ${step.body}
                `;
                list.appendChild(div);
            });
        }
        renderGuideSteps();
    </script>

    <!-- ================= مدل سه‌بعدی شماتیک (فعالیت ۷) ================= -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const host = document.querySelector('#threejs-canvas-wrapper');
        let scene, camera, renderer, controls;
        let objects = [], byName = {}, active = [];

        // 🧠 دیکشنری کامل توضیحات برای تمام اجزای مدل (به صورت دیوانه‌وار جامع)
        const fullDescriptions = {
            // سطح پشتی
            'نیم‌کره مخی چپ': { en: 'Left Cerebral Hemisphere', desc: 'نیم‌کره چپ مخ، بزرگ‌ترین بخش مغز است. این بخش مرکز پردازش اطلاعات حسی، حرکتی، شناختی و گفتار است. سطح آن پر از شیارها و شکنج‌هایی است که سطح تماس قشر مغز را برای پردازش‌های پیچیده افزایش می‌دهند.' },
            'نیم‌کره مخی راست': { en: 'Right Cerebral Hemisphere', desc: 'نیم‌کره راست مخ که با شیار طولی از نیم‌کره چپ جدا شده است. این بخش بیشتر در کنترل سمت چپ بدن، پردازش اطلاعات فضایی، تشخیص چهره و درک موسیقی نقش دارد.' },
            'شیار طولی بین دو نیم‌کره': { en: 'Longitudinal Fissure', desc: 'یک شیار بسیار عمیق در خط میانی مغز که دو نیم‌کره چپ و راست را از هم جدا می‌کند و تا جسم پینه‌ای ادامه دارد.' },
            'پیاز بویایی چپ': { en: 'Left Olfactory Bulb', desc: 'ساختار جلویی مغز که مسئول دریافت و پردازش اولیه سیگنال‌های بویایی است. این پیاز از طریق راه‌های بویایی به قشر مخ (بخش بویایی) متصل می‌شود.' },

        function initThreeScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x07111f);
            camera = new THREE.PerspectiveCamera(38, 1, .1, 100);
            camera.position.set(0, 1.1, 7.5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            host.appendChild(renderer.domElement);
            
            scene.add(new THREE.HemisphereLight(0xe8f3ff, 0x493426, 2.1));
            const key = new THREE.DirectionalLight(0xffffff, 3); key.position.set(-3, 5, 6); scene.add(key);
            const rim = new THREE.DirectionalLight(0x6aaaff, 1.5); rim.position.set(4, 1, -4); scene.add(rim);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0, 0);
            controls.minDistance = 3.5;
            controls.maxDistance = 18;

            // رویداد کلیک روی مدل
            const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
            renderer.domElement.addEventListener('click', e => {
                const r = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
                mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
                ray.setFromCamera(mouse, camera);
                const hits = ray.intersectObjects(objects);
                if (hits.length) selectPart(hits[0].object.userData.name);
            });

            document.querySelectorAll('#model-tabs button').forEach(b => b.addEventListener('click', () => {
                document.querySelectorAll('#model-tabs button').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                loadScene(b.dataset.scene);
            }));

            loadScene('external');
            resize();
            renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
        }

        // انتخاب اندام و نمایش اطلاعات
        function selectPart(name) {
            const data = fullDescriptions[name] || { en: name, desc: 'توضیحی برای این بخش ثبت نشده است.' };
            
            const panel = document.getElementById('info-panel');
            document.getElementById('info-fa').innerText = name;
            document.getElementById('info-en').innerText = data.en;
            document.getElementById('info-desc').innerText = data.desc;
            
            panel.classList.add('show');
            
            // هایلایت کردن مش انتخاب شده
            objects.forEach(o => {
                if (o.userData.name === name) {
                    o.material.emissive = new THREE.Color(0x00e5ff);
                    o.material.emissiveIntensity = 0.5;
                } else {
                    o.material.emissive = new THREE.Color(0x000000);
                    o.material.emissiveIntensity = 0;
                }
            });
        }

        function resetObjects() { for (const o of objects) scene.remove(o); objects = []; byName = {}; active = []; }
        function add(mesh, name, desc, mat = mesh.material) {
            mesh.userData = { name, desc, baseMat: mat };
            scene.add(mesh); objects.push(mesh); (byName[name] ??= []).push(mesh); return mesh;
        }
        function ball(name, desc, pos, scale, mat) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), mat);
            m.position.set(...pos); m.scale.set(...scale); return add(m, name, desc, mat);
        }
        function tube(name, desc, pts, r = .07, mat = mats.nerve) {
            const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)));
            return add(new THREE.Mesh(new THREE.TubeGeometry(c, 40, r, 10, false), mat), name, desc, mat);
        }
        function extrude(name, desc, pts, depth, mat, z = 0) {
            const s = new THREE.Shape(); s.moveTo(...pts[0]); pts.slice(1).forEach(p => s.lineTo(...p)); s.closePath();
            const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelSegments: 3, bevelSize: .05, bevelThickness: .05, curveSegments: 24 });
            const m = new THREE.Mesh(g, mat); m.position.z = z - depth / 2; return add(m, name, desc, mat);
        }

        // --- توابع ساخت مدل ---
        function buildExternal() {
            ball('نیم‌کره مخی چپ','',[-.78,.42,0],[.79,1.48,.48],mats.cortex);
            ball('نیم‌کره مخی راست','',[.78,.42,0],[.79,1.48,.48],mats.cortex);
            tube('شیار طولی بین دو نیم‌کره','',[[0,1.82,.43],[0,1.35,.49],[0,.8,.5],[0,.2,.49],[0,-.45,.4],[0,-.92,.22]],.045,mats.white);
            ball('پیاز بویایی چپ','',[-.28,1.88,.15],[.17,.24,.13],mats.gland);
            ball('پیاز بویایی راست','',[.28,1.88,.15],[.17,.24,.13],mats.gland);
            const folds=[
                [[-.35,1.55,.36],[-.48,1.25,.43],[-.39,.92,.47],[-.52,.58,.48],[-.42,.22,.46],[-.52,-.12,.39],[-.62,-.42,.3]],
                [[-.82,1.62,.30],[-1.05,1.35,.36],[-.98,1.02,.41],[-1.12,.72,.42],[-1.02,.35,.4],[-1.12,.02,.32],[-1.02,-.35,.22]],
                [[-1.25,1.35,.19],[-1.38,1.05,.25],[-1.3,.72,.3],[-1.42,.4,.29],[-1.32,.08,.23],[-1.22,-.25,.15]],
                [[-.18,1.42,.42],[-.22,1.08,.47],[-.16,.75,.49],[-.25,.4,.48],[-.17,.05,.44],[-.24,-.28,.35]]
            ];
            folds.forEach(pts=>tube('شکنج قشر مخ','',pts,.045,mats.cerebellum));
            folds.forEach(pts=>tube('شکنج قشر مخ','',pts.map(([x,y,z])=>[-x,y,z]),.045,mats.cerebellum));
            tube('شیار عرضی','',[[-.8,-.82,.2],[-.45,-.91,.28],[0,-.95,.3],[.45,-.91,.28],[.8,-.82,.2]],.035,mats.white);
            ball('نیم‌کره مخچه چپ','',[-.39,-1.28,.02],[.43,.43,.38],mats.cerebellum);
            ball('نیم‌کره مخچه راست','',[.39,-1.28,.02],[.43,.43,.38],mats.cerebellum);
            ball('کرمینه مخچه','',[0,-1.28,.36],[.14,.34,.12],mats.stem);
            for(let i=0;i<7;i++){const y=-1.02-i*.075; tube('چین‌های مخچه','',[[-.72,y,.18],[-.48,y-.035,.31],[-.22,y-.05,.39],[0,y-.055,.42],[.22,y-.05,.39],[.48,y-.035,.31],[.72,y,.18]],.022,mats.white);}
            ball('بصل‌النخاع','',[0,-1.82,-.04],[.22,.42,.22],mats.stem);
            tube('نخاع','',[[0,-2.12,-.02],[0,-2.42,-.02],[0,-2.72,-.02]],.105,mats.nerve);
        }
        
        function buildVentral() {
            ball('سطح زیرین نیم‌کره مخی چپ','',[-.78,.35,0],[.82,1.35,.5],mats.cortex);
            ball('سطح زیرین نیم‌کره مخی راست','',[.78,.35,0],[.82,1.35,.5],mats.cortex);
            ball('پیاز بویایی چپ','',[-.32,1.42,.35],[.19,.32,.16],mats.gland);
            ball('پیاز بویایی راست','',[.32,1.42,.35],[.19,.32,.16],mats.gland);
            tube('راه بویایی','',[[-.32,1.2,.35],[-.48,.9,.4],[-.65,.65,.38],[.32,1.2,.35],[.48,.9,.4],[.65,.65,.38]],.055,mats.nerve);
            ball('کیاسمای بینایی','',[0,.45,.48],[.25,.13,.12],mats.nerve);
            tube('عصب بینایی چپ','',[[-.18,.45,.4],[-.55,.2,.48],[-.9,-.02,.35]],.065,mats.nerve);
            tube('عصب بینایی راست','',[[.18,.45,.4],[.55,.2,.48],[.9,-.02,.35]],.065,mats.nerve);
            ball('میان‌مغز','',[0,-.35,.05],[.3,.34,.3],mats.stem);
            ball('پل مغزی','',[0,-.85,.05],[.48,.28,.34],mats.stem);
            ball('بصل‌النخاع','',[0,-1.35,.05],[.25,.48,.24],mats.stem);
            ball('مخچه','',[0,-1.05,-.35],[.68,.43,.35],mats.cerebellum);
            tube('نخاع','',[[0,-1.75,.05],[0,-2.1,.05],[0,-2.45,.05]],.13,mats.nerve);
        }

        function buildInternal() {
            ball('نیم‌کره برش‌خورده','',[0,0,0],[2.15,1.45,.45],mats.cortex);
            tube('جسم پینه‌ای','',[[-1.25,.55,.42],[-.8,.95,.42],[0,1.08,.42],[.8,.95,.42],[1.25,.55,.42]],.14,mats.white);
            tube('رابط سه‌گوش','',[[-.85,.15,.5],[-.4,.35,.5],[0,.15,.5],[.55,-.25,.5],[.9,-.35,.5]],.075,mats.white);
            ball('تالاموس','',[0,-.05,.55],[.52,.38,.25],mats.gray);
            ball('غده صنوبری','',[.72,.45,.52],[.16,.18,.16],mats.gland);
            ball('اجسام چهارقلو','',[.78,.05,.48],[.28,.23,.18],mats.stem);
            tube('بطن جانبی','',[[-1.1,.25,.52],[-.65,.52,.55],[0,.55,.55],[.55,.3,.55]],.095,mats.fluid);
            tube('بطن سوم','',[[0,.28,.62],[0,0,.62],[0,-.35,.62]],.07,mats.fluid);
            tube('بطن چهارم','',[[0,-.55,.58],[.25,-.85,.58],[.1,-1.05,.58]],.09,mats.fluid);
            tube('درخت زندگی','',[[0,-1.0,.48],[0,-1.25,.48],[-.35,-1.48,.48],[-.48,-1.7,.48],[0,-1.25,.48],[.35,-1.48,.48],[.48,-1.7,.48]],.055,mats.white);
            ball('مخچه','',[0,-1.55,.15],[.72,.42,.38],mats.cerebellum);
            ball('پل مغزی','',[0,-.95,.15],[.35,.22,.25],mats.stem);
            ball('بصل‌النخاع','',[0,-1.28,.15],[.23,.35,.2],mats.stem);
            ball('جسم مخطط','',[-.85,-.1,.57],[.28,.22,.15],mats.gland);
            ball('شبکه کوروئیدی','',[.35,.42,.65],[.22,.08,.08],mats.nerve);
            ball('رابط بین تالاموسی','',[0,-.02,.72],[.16,.07,.07],mats.white);
            ball('بطن جانبی چپ','',[-.5,.42,.62],[.16,.09,.08],mats.fluid);
            ball('بطن جانبی راست','',[.5,.42,.62],[.16,.09,.08],mats.fluid);
            ball('ماده سفید','',[-1.15,-.25,.42],[.38,.48,.12],mats.white);
            ball('قشر خاکستری','',[-1.48,-.2,.44],[.12,.55,.1],mats.gray);
        }

        function buildCord() {
            const oval=new THREE.Shape();oval.absellipse(0,0,2.05,1.55,0,Math.PI*2,false,0);
            const m=new THREE.Mesh(new THREE.ExtrudeGeometry(oval,{depth:.55,bevelEnabled:true,bevelSegments:4,bevelSize:.08,bevelThickness:.07,curveSegments:48}),mats.white);m.position.z=-.28;add(m,'ماده سفید','',mats.white);
            const parts=[
                ['شاخ پشتی راست',[[.1,1.1],[.35,.9],[.75,.65],[1.2,.45],[1.35,.2],[.95,.22],[.5,.5],[.18,.62]]],
                ['شاخ پشتی چپ',[[-.1,1.1],[-.35,.9],[-.75,.65],[-1.2,.45],[-1.35,.2],[-.95,.22],[-.5,.5],[-.18,.62]]],
                ['شاخ جانبی راست',[[.4,.25],[.8,.1],[1,-.15],[.8,-.35],[.45,-.12]]],
                ['شاخ جانبی چپ',[[-.4,.25],[-.8,.1],[-1,-.15],[-.8,-.35],[-.45,-.12]]],
                ['شاخ جلویی راست',[[.15,-.2],[.5,-.45],[.85,-.85],[.75,-1.1],[.45,-.95],[.15,-.55]]],
                ['شاخ جلویی چپ',[[-.15,-.2],[-.5,-.45],[-.85,-.85],[-.75,-1.1],[-.45,-.95],[-.15,-.55]]]
            ];
            parts.forEach(([n,p])=>extrude(n,'',p,.62,mats.gray,.04));
            ball('مجرای مرکزی','',[0,-.03,.4],[.075,.075,.05],mats.fluid);
            tube('شیار میانی پشتی','',[[0,1.35,.35],[0,1.55,.35]],.035,mats.stem);
            tube('شکاف میانی جلویی','',[[0,-1.2,.35],[0,-1.5,.35]],.06,mats.stem);
            tube('ریشه پشتی','',[[1.2,.35,.05],[1.75,.58,.05],[2.2,.62,.05]],.07,mats.nerve);
            tube('ریشه جلویی','',[[1.0,-.65,.05],[1.7,-.85,.05],[2.2,-.9,.05]],.07,mats.nerve);
            ball('عقده ریشه پشتی','',[1.82,.58,.05],[.18,.14,.13],mats.gland);
        }

        function buildReflex() {
            ball('گیرنده حسی','',[-2.1,1.1,0],[.28,.28,.22],mats.gland);
            ball('نورون حسی','',[-1.1,.55,0],[.22,.22,.18],mats.nerve);
            ball('عقده ریشه پشتی','',[-.25,.9,0],[.22,.22,.18],mats.gland);
            ball('نخاع','',[0,0,0],[.62,.62,.25],mats.cortex);
            ball('نورون رابط','',[0,-.05,.3],[.18,.18,.14],mats.gray);
            ball('نورون حرکتی','',[1.1,-.55,0],[.22,.22,.18],mats.nerve);
            ball('ماهیچه','',[2.1,-1.1,0],[.35,.25,.2],mats.cerebellum);
            tube('مسیر حسی','',[[-1.85,1.0,0],[-1.1,.7,0],[-.45,.35,0],[0,.12,0]],.065,mats.nerve);
            tube('مسیر حرکتی','',[[.1,-.15,0],[.65,-.45,0],[1.2,-.65,0],[1.85,-1.0,0]],.065,mats.nerve);
        }

        function buildSpinalNerves() {
            tube('نخاع گوسفند','',[[-2.55,0,0],[-1.6,0,0],[-.6,0,0],[.45,0,0],[1.45,0,0],[2.35,0,0]],.24,mats.cortex);
            for(let i=0;i<13;i++){
                const x=-2.55+i*.405;
                tube('قوس مهره‌ای','',[[x-.12,.55,0],[x-.25,.82,0],[x,.98,0],[x+.25,.82,0],[x+.12,.55,0]],.065,mats.bone);
                tube('جسم مهره','',[[x-.16,-.42,0],[x,-.53,0],[x+.16,-.42,0]],.11,mats.bone);
            }
            const regions=[
                {n:'گردنی',count:8,start:-2.35,step:.22},
                {n:'سینه‌ای',count:12,start:-.55,step:.19},
                {n:'کمری',count:5,start:1.95,step:.18},
                {n:'خاجی',count:5,start:2.55,step:.15},
                {n:'دنبالچه‌ای',count:1,start:3.15,step:.15}
            ];
            regions.forEach((r,ri)=>{
                for(let i=0;i<r.count;i++){
                    const x=r.start+i*r.step;
                    const long=ri>=2 ? .8+(i*.09) : .62;
                    tube(r.n+' - ریشه پشتی','',[[x,.12,.08],[x-.05,.36,.08],[x-long*.55,.57,.08],[x-long,.62,.08]],.033,mats.nerve);
                    ball('عقده ریشه پشتی','',[x-long*.63,.55,.13],[.095,.095,.09],mats.gland);
                    tube(r.n+' - ریشه شکمی','',[[x,-.12,.08],[x-.04,-.34,.08],[x-long*.55,-.48,.08],[x-long,-.5,.08]],.033,mats.nerve);
                    tube('عصب نخاعی مختلط','',[[x-long,-.5,.08],[x-long-.22,-.08,.08],[x-long-.32,.08,.08],[x-long-.25,.62,.08]],.05,mats.gold);
                    tube('شاخه پشتی','',[[x-long-.25,.08,.08],[x-long-.48,.26,.08],[x-long-.72,.3,.08]],.04,mats.cerebellum);
                    tube('شاخه شکمی','',[[x-long-.25,.08,.08],[x-long-.48,-.17,.08],[x-long-.75,-.3,.08]],.045,mats.cerebellum);
                }
            });
            tube('انتهای دمی نخاع','',[[2.2,0,0],[2.55,0,0],[2.82,-.04,0]],.14,mats.stem);
        }

        function buildCranial() {
            ball('مغز','',[0,.5,0],[1.25,.8,.42],mats.cortex);
            tube('ساقه مغز','',[[0,0,0],[0,-.6,0],[0,-1.2,0]],.22,mats.stem);
            const names=[
                ['عصب بویایی (I)',''],['عصب بینایی (II)',''],['عصب حرکتی چشم (III)',''],['عصب قرقره‌ای (IV)',''],['عصب سه‌قلو (V)',''],['عصب دورکننده (VI)',''],['عصب چهره‌ای (VII)',''],['عصب دهلیزی‌حلزونی (VIII)',''],['عصب زبانی‌حلقی (IX)',''],['عصب واگ (X)',''],['عصب فرعی (XI)',''],['عصب زیرزبانی (XII)','']
            ];
            names.forEach(([n,d],i)=>{
                const side=i%2===0?-1:1, row=Math.floor(i/2), y=.5-row*.34, endx=side*(1.15+(i%3)*.12);
                tube(n,d,[[side*.55,y+.05,.18],[side*.9,y-.05,.1],[endx,y-.22,.04]],.045,mats.nerve);
            });
        }

        const builders = { external: buildExternal, ventral: buildVentral, internal: buildInternal, cord: buildCord, reflex: buildReflex, spinalNerves: buildSpinalNerves, cranial: buildCranial };

        function loadScene(id) {
            resetObjects();
            document.getElementById('info-panel').classList.remove('show'); // بستن پنل
            camera.position.set(0, 1.1, 7.5); controls.target.set(0, 0, 0); controls.update();
            if (builders[id]) {
                builders[id]();
            }
        }

        function resize() {
            const w = host.clientWidth, h = host.clientHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h; camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        
        setTimeout(() => {
            initThreeScene();
            new ResizeObserver(resize).observe(host);
        }, 500);
    </script>
