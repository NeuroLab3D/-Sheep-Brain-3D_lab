<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشریح سه‌بعدی مغز گوسفند</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #121212; 
            font-family: Tahoma, sans-serif; 
        }
        
        /* پنل دکمه‌ها */
        #ui-panel {
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85); 
            color: white;
            padding: 12px 20px; 
            border-radius: 50px; 
            border: 1px solid #555;
            display: flex; 
            gap: 10px; 
            z-index: 10; 
            flex-wrap: wrap; 
            justify-content: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        button {
            background: #333; 
            color: white; 
            border: 1px solid #666;
            padding: 8px 16px; 
            border-radius: 30px; 
            cursor: pointer;
            font-family: inherit; 
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        button:hover { 
            background: #4fc3f7; 
            color: #000; 
            border-color: #4fc3f7; 
        }
        
        /* عنوان بالای صفحه */
        #title { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            color: white; 
            font-size: 20px; 
            font-weight: bold; 
            z-index: 10; 
            text-shadow: 0 2px 4px #000;
            pointer-events: none;
        }

        /* صفحه لودینگ */
        #loading {
            position: fixed; 
            inset: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #121212; 
            color: #4fc3f7; 
            z-index: 100;
            font-size: 18px;
            flex-direction: column;
            gap: 15px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        در حال بارگذاری مغز گوسفند...
    </div>
    
    <div id="title">🧠 مغز گوسفند</div>

    <div id="ui-panel">
        <button onclick="changeView('front')">نمای روبرو</button>
        <button onclick="changeView('angle')">نمای کج</button>
        <button onclick="changeView('top')">نمای از بالا</button>
        <button onclick="toggleRotate()" id="rotBtn">توقف چرخش</button>
    </div>

    <!-- بارگذاری کتابخانه Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. ساخت صحنه
        const scene = new THREE.Scene();
        
        // 2. تنظیمات دوربین
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12); // فاصله اولیه دوربین

        // 3. موتور رندر
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 4. نورپردازی (برای اینکه عکس تاریک نشه)
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 10);
        scene.add(dirLight);

        // 5. کنترل موس و لمس (چرخش و زوم)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.autoRotate = true; // چرخش خودکار در ابتدا
        controls.autoRotateSpeed = 1.5;
        controls.minDistance = 4; // حداقل زوم
        controls.maxDistance = 25; // حداکثر زوم

        let isRotating = true;

        // 6. بارگذاری عکس روی صفحه سه‌بعدی
        // ⚠️ مهم: اسم عکسی که آپلود می‌کنی باید دقیقا brain.jpg باشه
        const IMAGE_URL = 'brain.jpg'; 

        const textureLoader = new THREE.TextureLoader();
        
        textureLoader.load(IMAGE_URL, (texture) => {
            // اصلاح رنگ‌ها
            texture.colorSpace = THREE.SRGBColorSpace;
            
            // محاسبه نسبت عکس که کشیده نشه
            const img = texture.image;
            const aspect = img.width / img.height;
            
            // ساخت صفحه به اندازه عکس
            const planeGeometry = new THREE.PlaneGeometry(10 * aspect, 10);
            
            // جنس صفحه (رویه)
            const material = new THREE.MeshStandardMaterial({ 
                map: texture,
                roughness: 0.4,
                metalness: 0.1,
                transparent: true
            });

            // ساخت جسم اصلی (رویه)
            const brainMesh = new THREE.Mesh(planeGeometry, material);
            
            // ساخت لایه پشتی (برای ایجاد افکت ضخامت و عمق)
            const backMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                roughness: 0.9
            });
            const backMesh = new THREE.Mesh(planeGeometry, backMaterial);
            backMesh.position.z = -0.3; // لایه پشتی کمی عقب‌تر
            
            // اضافه کردن به صحنه
            scene.add(brainMesh);
            scene.add(backMesh);

            // مخفی کردن لودینگ بعد از لود عکس
            document.getElementById('loading').style.display = 'none';

        }, undefined, (err) => {
            // اگر عکس پیدا نشد
            document.getElementById('loading').innerHTML = "خطا!<br>عکسی با نام brain.jpg پیدا نشد.<br>مطمئن شو عکس رو در گیت‌هاب آپلود کردی.";
            console.error(err);
        });

        // 7. توابع دکمه‌ها
        // تغییر زاویه دوربین
        window.changeView = function(view) {
            controls.autoRotate = false;
            isRotating = false;
            document.getElementById('rotBtn').innerText = "شروع چرخش";

            if (view === 'front') {
                camera.position.set(0, 0, 12);
            } else if (view === 'angle') {
                camera.position.set(8, 5, 10);
            } else if (view === 'top') {
                camera.position.set(0, 12, 0.1);
            }
            controls.target.set(0, 0, 0); 
        };

        // توقف / شروع چرخش
        window.toggleRotate = function() {
            isRotating = !isRotating;
            controls.autoRotate = isRotating;
            document.getElementById('rotBtn').innerText = isRotating ? "توقف چرخش" : "شروع چرخش";
        };

        // 8. حلقه رندر (انیمیشن)
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 9. واکنش به تغییر سایز صفحه
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
